<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>요리 타이머</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e1b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="요리타이머">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1e1b18;
    color: #f4ede4;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 20px 48px;
  }
  .card {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 28px;
    text-align: center;
    color: #e8b96a;
  }
  .display {
    text-align: center;
    font-size: 96px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 40px 0;
    background: #2a2521;
    border-radius: 24px;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .sub-display {
    text-align: center;
    font-size: 20px;
    color: #c9b8a3;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .sub-display span {
    color: #e8b96a;
    font-weight: 700;
    font-size: 24px;
  }
  .row {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
  }
  .field {
    flex: 1;
    background: #2a2521;
    border-radius: 18px;
    padding: 16px 14px;
  }
  .field label {
    display: block;
    font-size: 16px;
    color: #a89787;
    margin-bottom: 10px;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    color: #f4ede4;
    font-size: 34px;
    font-weight: 700;
    outline: none;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .buttons {
    display: flex;
    gap: 14px;
    margin-top: 24px;
  }
  button {
    flex: 1;
    padding: 24px 0;
    border: none;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }
  .start { background: #e8b96a; color: #1e1b18; }
  .start:disabled { opacity: 0.5; }
  .pause { background: #4a423a; color: #f4ede4; }
  .reset { background: #4a423a; color: #f4ede4; }
  .status {
    text-align: center;
    margin-top: 24px;
    font-size: 20px;
    color: #a89787;
    min-height: 26px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🍳 요리 타이머</h1>

  <div class="display" id="display">05:00</div>

  <div class="row">
    <div class="field">
      <label>분</label>
      <input type="number" id="minInput" min="0" max="180" value="5">
    </div>
    <div class="field">
      <label>초</label>
      <input type="number" id="secInput" min="0" max="59" value="0">
    </div>
    <div class="field">
      <label>알림 간격(1~60초)</label>
      <input type="number" id="intervalInput" min="1" max="60" value="30">
    </div>
  </div>

  <div class="buttons">
    <button class="start" id="startBtn">시작</button>
    <button class="pause" id="pauseBtn">일시정지</button>
    <button class="reset" id="resetBtn">리셋</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
let totalSeconds = 300;
let remaining = 300;
let intervalSec = 30;
let subCountdown = 30;
let timerId = null;
let running = false;

const display = document.getElementById('display');
const status = document.getElementById('status');
const minInput = document.getElementById('minInput');
const secInput = document.getElementById('secInput');
const intervalInput = document.getElementById('intervalInput');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function updateDisplay() {
  display.textContent = fmt(remaining);
}

let audioCtx = null;

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playBeep(freq, duration) {
  try {
    const ctx = ensureAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.9, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function shortBeep() {
  playBeep(880, 0.12);
  setTimeout(() => playBeep(880, 0.12), 180);
}

function finalBeep() {
  playBeep(660, 0.25);
  setTimeout(() => playBeep(660, 0.25), 300);
  setTimeout(() => playBeep(880, 0.5), 600);
}

function readInputs() {
  const m = parseInt(minInput.value) || 0;
  const s = parseInt(secInput.value) || 0;
  let iv = parseInt(intervalInput.value) || 30;
  iv = Math.min(60, Math.max(1, iv));
  intervalInput.value = iv;
  totalSeconds = m * 60 + s;
  remaining = totalSeconds;
  intervalSec = iv;
  subCountdown = iv;
  updateDisplay();
}

function tick() {
  if (remaining <= 0) {
    clearInterval(timerId);
    running = false;
    status.textContent = '⏰ 완료!';
    finalBeep();
    setUIState();
    return;
  }
  remaining -= 1;
  subCountdown -= 1;
  if (subCountdown <= 0) {
    subCountdown = intervalSec;
    if (remaining > 0) shortBeep();
  }
  updateDisplay();
}

function setUIState() {
  startBtn.disabled = running;
  minInput.disabled = running;
  secInput.disabled = running;
  intervalInput.disabled = running;
}

startBtn.addEventListener('click', () => {
  if (running) return;
  ensureAudioContext();
  if (remaining === totalSeconds || remaining === 0) {
    readInputs();
    if (totalSeconds <= 0) {
      status.textContent = '시간을 설정해 주세요';
      return;
    }
  }
  running = true;
  status.textContent = '진행 중...';
  setUIState();
  timerId = setInterval(tick, 1000);
});

pauseBtn.addEventListener('click', () => {
  if (!running) return;
  clearInterval(timerId);
  running = false;
  status.textContent = '일시정지됨';
  setUIState();
});

resetBtn.addEventListener('click', () => {
  clearInterval(timerId);
  running = false;
  status.textContent = '';
  readInputs();
  setUIState();
});

readInputs();

intervalInput.addEventListener('change', () => {
  if (running) return;
  let iv = parseInt(intervalInput.value) || 30;
  iv = Math.min(60, Math.max(1, iv));
  intervalInput.value = iv;
  intervalSec = iv;
  subCountdown = iv;
  updateDisplay();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
